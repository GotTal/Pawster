name: Repository checks
on:
  pull_request:
    branches: [main, "testing/**"]
  push:
    branches: [main, "testing/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare Python checks
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r Scripts/requirements-checks.txt
      - name: Check documentation, issue forms and workflows
        run: .venv/bin/python Scripts/check-community.py
      - name: Check language packs and offline documents
        run: .venv/bin/python Scripts/check-localizations.py
      - name: Test file verification and CI routing
        run: .venv/bin/python -m unittest discover -s Scripts/tests -v
