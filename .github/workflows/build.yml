name: Build and test Pawster
on:
  push:
    branches: [main, "testing/**"]
  pull_request:
    branches: [main, "testing/**"]
  workflow_dispatch:
    inputs:
      package_ipa:
        description: Package an IPA after validation / 验证后打包 IPA
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed files
        id: scope
        run: python3 Scripts/ci-scope.py
  ios:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PAWSTER_BUILD_CHANNEL: ${{ github.ref_name == 'main' && 'release' || 'test' }}
      PAWSTER_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          xcodebuild -version
      - name: Check Swift types before compiling Rust
        run: |
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 \
            -import-objc-header App/Native/Bridge.h -I Core/include App/*.swift
      - name: Validate language packs and offline documents
        run: python3 Scripts/check-localizations.py
      - name: Test release integrity verification
        run: |
          python3 -m venv build/release-checks
          build/release-checks/bin/pip install -r Scripts/requirements-release.txt
          build/release-checks/bin/python -m unittest discover -s Scripts/tests -v
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Core/target
          key: ${{ runner.os }}-${{ runner.arch }}-pawster-rust-${{ hashFiles('Core/Cargo.lock') }}
      - name: Rust tests
        run: cargo test --locked --manifest-path Core/Cargo.toml --features device
      - name: Build iOS and simulator libraries
        run: bash Scripts/build-core.sh
      - name: Save compiled Rust dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Core/target
          key: ${{ runner.os }}-${{ runner.arch }}-pawster-rust-${{ hashFiles('Core/Cargo.lock') }}
      - name: Select an available simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); runtimes=sorted(((tuple(map(int,k.split(".iOS-")[1].split("-"))),v) for k,v in d["devices"].items() if ".iOS-" in k and int(k.split(".iOS-")[1].split("-")[0])>=26),reverse=True); print(next(x["udid"] for _,items in runtimes for x in items if "iPhone" in x["name"]))')"
          echo "TEST_DESTINATION=platform=iOS Simulator,id=$simulator_id" >> "$GITHUB_ENV"
      - name: Swift and transaction tests
        run: bash Scripts/test-macos.sh
      - name: Capture clean simulator screens for documentation
        if: github.event_name == 'pull_request'
        run: bash Scripts/capture-doc-screenshots.sh
      - name: Upload documentation screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Pawster-documentation-${{ github.run_number }}
          path: build/DocumentationScreenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Package IPA
        id: package
        if: needs.scope.outputs.package == 'true'
        run: bash Scripts/build-ipa.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: needs.scope.outputs.package == 'true'
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: build/Packages/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Pawster-test-results-${{ github.run_number }}
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
  validation:
    name: iOS validation
    needs: [scope, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the checks selected for this change
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native }}
          NATIVE_RESULT: ${{ needs.ios.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$NATIVE_REQUIRED" = true ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi
