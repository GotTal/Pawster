[package]
name = "posterbridge-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "posterbridge_core"
crate-type = ["staticlib", "rlib"]

[features]
default = []
device = ["dep:idevice", "dep:idevice-ffi", "dep:tokio", "dep:tracing", "dep:plist"]

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
idevice = { path = "vendor/idevice", optional = true, default-features = false, features = ["ring", "remote_pairing", "tunnel_tcp_stack", "rsd", "tcp", "xpc", "core_device_proxy", "pair", "usbmuxd", "installation_proxy", "afc"] }
idevice-ffi = { path = "vendor/idevice-ffi", optional = true, default-features = false, features = ["full", "ring"] }
tokio = { version = "1", optional = true, features = ["rt", "net", "macros", "fs", "time"] }
tracing = { version = "0.1", optional = true }
plist = { version = "1", optional = true }

[patch."https://github.com/jkcoxson/idevice.git"]
idevice = { path = "vendor/idevice" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
opt-level = 3
